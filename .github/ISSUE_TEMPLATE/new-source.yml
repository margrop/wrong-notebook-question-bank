name: 题库来源建议
description: 推荐可以收录的开放题库，或询问某个来源、许可能否收录
labels: ["题库来源"]
body:
  - type: input
    id: url
    attributes:
      label: 来源链接
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: 许可
      description: 来源声明的许可；没有声明请写「未声明」
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 说明
      description: 学段、学科、大致题数，是否带答案、解析、知识点
