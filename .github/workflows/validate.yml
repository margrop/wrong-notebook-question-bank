name: 校验

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 校验题库与工具
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 jsonschema（仅测试使用）
        run: pip install --quiet jsonschema
      - name: 工具测试与 JSON Schema 校验
        run: python3 -m unittest discover -s tests -v
      - name: 校验整个仓库
        run: python3 scripts/qbank.py validate --quiet
      - name: 列出本次改动的题库包的警告
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=AM "$BASE_SHA"...HEAD -- 'banks/*/*.json' ':!banks/*/collection.json')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "本次没有改动题库包"
            exit 0
          fi
          python3 scripts/qbank.py validate "${files[@]}"

  purge-cdn:
    # 应用经 jsDelivr 读取 main 分支的 index.json 和题库包。CDN 按路径缓存：
    # 包被移动或下架后，旧索引指向的文件已不存在，下载会失败；包内容更新后，同一路径仍返回旧文件。
    # 所以合并后刷新索引和本次改动的题库包。
    name: 刷新 CDN 缓存
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 刷新 jsDelivr 缓存
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          files=(index.json)
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            mapfile -t changed < <(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'banks/*/*.json' ':!banks/*/collection.json')
            files+=("${changed[@]}")
          fi
          # jsDelivr 的刷新偶尔不生效，隔一分钟重复一次
          for attempt in 1 2; do
            for file in "${files[@]}"; do
              echo "刷新 $file"
              curl --fail --silent --show-error --output /dev/null "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/${file}"
            done
            sleep 60
          done

  validate-with-main-rules:
    # 用主分支的校验脚本检查 PR 的数据，防止通过修改校验脚本放行问题数据。
    # PR 确实需要调整规则时本任务可能失败，由维护者判断。
    name: 用主分支规则校验
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pr
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验
        run: |
          if [ ! -f base/scripts/qbank.py ]; then
            echo "主分支还没有 scripts/qbank.py，跳过"
            exit 0
          fi
          python3 base/scripts/qbank.py --root pr validate --quiet
